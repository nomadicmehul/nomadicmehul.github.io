name: "🎤 Add speaking event"
description: Add a talk/workshop to data/speaking.json — the site updates automatically.
title: "[speaking] "
labels: ["data:speaking"]
body:
  - type: markdown
    attributes:
      value: |
        📅 **Prefer a calendar, live preview and suggestions?** Use the [Content Studio](https://nomadicmehul.dev/studio.html) — it fills this in for you.

        Submitting commits the event to `data/speaking.json` and redeploys the site. Files you drag in are saved to
        `assets/events/<year>/<date>-<event-name>/` and open in the browser. Only issues opened by the repo owner are processed.
  - type: input
    id: title
    attributes:
      label: Event title
      placeholder: Google Cloud Summit Czech Republic 2026
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: "YYYY-MM-DD, or written out like 9 Jun 2026 / 09.06.2026"
      placeholder: "2026-06-09"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: Prague, Czech Republic
    validations:
      required: true
  - type: checkboxes
    id: role
    attributes:
      label: Role
      # roles:start — generated from data/roles.json by build_manage.py
      options:
        - label: "Speaker"
        - label: "Event Organizer"
        - label: "Mentor"
        - label: "Panelist"
        - label: "Workshop Lead"
        - label: "Workshop Facilitator"
      # roles:end
  - type: input
    id: topics
    attributes:
      label: Topics
      description: Comma-separated
      placeholder: Kubernetes, GKE, AI Agents
    validations:
      required: true
  - type: input
    id: event_url
    attributes:
      label: Event page URL
      placeholder: https://...
  - type: textarea
    id: slides_url
    attributes:
      label: Slides
      description: "Drag a PDF or PPTX here (or paste a URL). It's saved in this event's folder on the site, so it opens in a new tab instead of downloading."
  - type: input
    id: code_url
    attributes:
      label: Code repo URL
      placeholder: https://github.com/...
  - type: input
    id: demo_url
    attributes:
      label: Live demo URL
  - type: input
    id: video_url
    attributes:
      label: Recording URL
      placeholder: https://youtube.com/watch?v=...
  - type: input
    id: blog_url
    attributes:
      label: Blog post URL
