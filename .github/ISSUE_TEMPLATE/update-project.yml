# Generated by .github/scripts/build_edit_forms.py from data/projects.json — don't edit by hand.
name: "🚀 Update or remove project"
description: "Pick an existing project to change or delete — the site updates automatically."
title: "[edit] project"
labels: ["data:edit"]
body:
  - type: markdown
    attributes:
      value: "Pick the entry, then fill in **only what should change** — blank fields keep their current value. Only issues opened by the repo owner are processed."
  - type: dropdown
    id: entry
    attributes:
      label: "Project"
      description: "4 entries"
      options:
        - "Dispatch"
        - "Azure MCP Server"
        - "Hello GenAI"
        - "CloudCaptain"
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Action
      description: Remove deletes the whole entry and ignores the fields below
      options:
        - Update
        - Remove
      default: 0
    validations:
      required: true
  - type: input
    id: new_0
    attributes:
      label: "New title"
  - type: textarea
    id: new_1
    attributes:
      label: "New description"
  - type: input
    id: new_2
    attributes:
      label: "New repo URL"
      description: "https://github.com/..."
  - type: input
    id: new_3
    attributes:
      label: "New tech"
      description: "Comma-separated; replaces the current list"
  - type: input
    id: new_4
    attributes:
      label: "New icon"
      description: "FontAwesome 6 class, e.g. fas fa-cloud"
  - type: input
    id: new_5
    attributes:
      label: "New icon color"
      description: "Hex color, e.g. #4ade80"
  - type: dropdown
    id: new_6
    attributes:
      label: "Featured"
      options:
        - "Keep"
        - "Yes"
        - "No"
      default: 0
      description: "Show on the home page"
