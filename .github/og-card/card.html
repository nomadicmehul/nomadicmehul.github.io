<!doctype html>
<!--
  Source for assets/og-image.png — the 1200×630 link-preview image (LinkedIn, X, Slack, WhatsApp).
  Edit this file, then run .github/og-card/render.sh to regenerate the PNG.
  Lives under .github/ so it isn't deployed with the site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root {
        --term-green: #4ade80; --term-amber: #fbbf24; --term-cyan: #22d3ee; --term-red: #f87171;
        --term-blue: #60a5fa; --term-purple: #c084fc;
        --bg-primary: #0a0e17; --bg-card: #111827; --border: #1f2937;
        --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        background:
            radial-gradient(circle at 85% 20%, rgba(34, 211, 238, 0.10), transparent 45%),
            radial-gradient(circle at 10% 90%, rgba(74, 222, 128, 0.12), transparent 50%),
            var(--bg-primary);
        font-family: 'Inter', sans-serif; color: var(--text-primary);
        position: relative;
    }
    /* faint grid, like the site's terminal backdrop */
    body::before {
        content: ''; position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(74, 222, 128, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(74, 222, 128, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
    }
    .window {
        position: absolute; inset: 40px;
        background: rgba(17, 24, 39, 0.82);
        border: 1px solid var(--border); border-radius: 18px;
        box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.08), 0 30px 80px rgba(0, 0, 0, 0.5);
        overflow: hidden;
    }
    .titlebar {
        height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 20px;
        background: rgba(15, 22, 35, 0.9); border-bottom: 1px solid var(--border);
        font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--text-muted);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .titlebar .label { margin-left: 14px; }
    .content { display: flex; gap: 48px; padding: 38px 52px 0; }
    .left { flex: 1; min-width: 0; }
    .prompt { font-family: 'JetBrains Mono', monospace; font-size: 20px; margin-bottom: 14px; }
    .prompt .u { color: var(--term-green); } .prompt .at { color: var(--term-amber); }
    .prompt .h { color: var(--term-cyan); } .prompt .p { color: var(--term-blue); }
    .prompt .hash { color: var(--term-red); } .prompt .cmd { color: var(--text-primary); }
    h1 { font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
    .role {
        font-size: 38px; font-weight: 700; letter-spacing: -0.5px; margin-top: 10px;
        background: linear-gradient(90deg, var(--term-green), var(--term-cyan));
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .chip {
        display: inline-flex; align-items: center; gap: 9px;
        font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700;
        padding: 8px 14px; border-radius: 10px;
        background: rgba(74, 222, 128, 0.08); border: 1px solid rgba(74, 222, 128, 0.25); color: var(--text-primary);
    }
    .chip i { font-size: 18px; }
    .stats { display: flex; gap: 34px; margin-top: 30px; }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; color: var(--term-green); line-height: 1; }
    .stat .l { font-size: 15px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }
    .right { width: 300px; flex-shrink: 0; padding-top: 8px; }
    .photo {
        width: 300px; height: 300px; border-radius: 22px; object-fit: cover; display: block;
        border: 2px solid rgba(74, 222, 128, 0.55);
        box-shadow: 0 0 0 6px rgba(74, 222, 128, 0.08), 0 0 50px rgba(74, 222, 128, 0.25);
    }
    .url {
        position: absolute; left: 52px; right: 52px; bottom: 30px;
        display: flex; justify-content: space-between; align-items: center;
        font-family: 'JetBrains Mono', monospace; font-size: 22px; color: var(--text-secondary);
    }
    .url b { color: var(--term-green); font-weight: 700; }
    .cursor { display: inline-block; width: 12px; height: 24px; background: var(--term-green); vertical-align: -4px; margin-left: 4px; }
    .loc { font-size: 18px; color: var(--text-muted); }
    .loc i { color: var(--term-red); margin-right: 6px; }
</style>
</head>
<body>
    <div class="window">
        <div class="titlebar">
            <span class="dot" style="background:#f87171"></span>
            <span class="dot" style="background:#fbbf24"></span>
            <span class="dot" style="background:#4ade80"></span>
            <span class="label">root@mehul: ~</span>
        </div>
        <div class="content">
            <div class="left">
                <div class="prompt"><span class="u">root</span><span class="at">@</span><span class="h">mehul</span>:<span class="p">~</span><span class="hash">#</span> <span class="cmd">whoami</span></div>
                <h1>Mehul Patel</h1>
                <div class="role">DevOps &amp; Cloud Expert</div>
                <div class="chips">
                    <span class="chip"><i class="fab fa-docker" style="color:#2496ed"></i> Docker Captain</span>
                    <span class="chip"><i class="fab fa-google" style="color:#4285f4"></i> Google Developer Expert</span>
                    <span class="chip"><i class="fab fa-aws" style="color:#ff9900"></i> AWS Community Builder</span>
                    <span class="chip"><i class="fas fa-asterisk" style="color:#d97757"></i> Claude Ambassador</span>
                </div>
                <div class="stats">
                    <div class="stat"><div class="v">14+</div><div class="l">Years</div></div>
                    <div class="stat"><div class="v">500+</div><div class="l">Sessions</div></div>
                    <div class="stat"><div class="v">25+</div><div class="l">Countries</div></div>
                    <div class="stat"><div class="v">50K+</div><div class="l">Developers</div></div>
                </div>
            </div>
            <div class="right">
                <img class="photo" src="../../assets/img/profile.jpg" alt="">
            </div>
        </div>
        <div class="url">
            <span><b>nomadicmehul.dev</b><span class="cursor"></span></span>
            <span class="loc"><i class="fas fa-map-marker-alt"></i>Berlin, Germany</span>
        </div>
    </div>
</body>
</html>
