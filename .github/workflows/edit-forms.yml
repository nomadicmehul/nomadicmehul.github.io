name: Refresh MANAGE.md, forms & entry dates

# After a direct push to data/*.json:
#  - stamp added/updated dates on new or changed entries (stamp_dates.py)
#  - regenerate MANAGE.md (entries by year/month with update/remove links) and the issue forms
# (issue-to-data.yml does both itself; its GITHUB_TOKEN pushes don't trigger this.)

on:
  push:
    branches: [main]
    paths:
      - 'data/speaking.json'
      - 'data/projects.json'
      - 'data/testimonials.json'
      - 'data/roles.json'
      - '.github/scripts/build_manage.py'
      - '.github/scripts/stamp_dates.py'
      - '.github/scripts/issue_to_data.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp entry dates
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # manual runs and brand-new branches have no usable "before"; compare with the previous commit
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=HEAD~1; fi
          python3 .github/scripts/stamp_dates.py --base "$BEFORE"

      - name: Regenerate MANAGE.md and forms
        run: python3 .github/scripts/build_manage.py

      - name: Commit if changed
        run: |
          [ -z "$(git status --porcelain)" ] && { echo "Already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data .github/ISSUE_TEMPLATE MANAGE.md
          git commit -m "chore: stamp entry dates, refresh MANAGE.md and forms"
          git push
          # data files changed, and pushes made with GITHUB_TOKEN don't trigger deploy.yml
          git diff --quiet HEAD~1 -- data || gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
