name: Check links

# Weekly check of every URL in data/*.json. Keeps a single open
# "Broken links report" issue up to date, and closes it once everything is fixed.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Broken links report
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: check
        env:
          REPORT_FILE: ${{ runner.temp }}/report.md
        run: python3 .github/scripts/check_links.py

      - name: Open, update or close the report issue
        env:
          BROKEN: ${{ steps.check.outputs.broken }}
        run: |
          REPORT="$RUNNER_TEMP/report.md"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ "$BROKEN" -gt 0 ]; then
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file "$REPORT"
            else
              gh issue create --title "$TITLE" --body-file "$REPORT"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "✅ All links are working again."
          fi
