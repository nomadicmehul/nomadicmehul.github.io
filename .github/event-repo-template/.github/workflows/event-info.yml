name: Event info

# "[event] …" issues opened by the repo owner (from Demo Studio on nomadicmehul.dev, or the
# "Event info" issue form) → event.json, files in event/ and the event section of README.md,
# then a comment and the issue is closed. A push that changes event.json (Demo Studio's
# "Connect GitHub" mode commits it directly, or a hand edit) re-renders the README.
# If something is invalid, the errors are commented on the issue; editing the issue re-runs this.

on:
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [main]
    paths: [event.json]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: event-info
  cancel-in-progress: false

jobs:
  update:
    # never runs in the template itself, only in repos created from it
    if: >-
      !github.event.repository.is_template &&
      (github.event_name != 'issues' ||
       (github.event.issue.state == 'open' &&
        github.event.issue.author_association == 'OWNER' &&
        startsWith(github.event.issue.title, '[event]')))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7

      - name: Apply issue and render README
        id: apply
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/event_info.py

      - name: Commit and push
        run: |
          git add -A event.json README.md
          # event/ only exists once a file was added (and may be gone again after removing them all)
          if [ -e event ] || git ls-files --error-unmatch event >/dev/null 2>&1; then git add -A event; fi
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "event: update event info${ISSUE:+ (closes #$ISSUE)}"
          git push

      - name: Report success
        if: github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failure
        if: failure() && github.event_name == 'issues'
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          [ "$APPLY_OUTCOME" = "failure" ] && [ -s "$RUNNER_TEMP/result.md" ] || echo "❌ Workflow failed — see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/result.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
