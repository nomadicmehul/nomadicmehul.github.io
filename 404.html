<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Command Not Found</title>
    <meta name="description" content="The page you're looking for doesn't exist.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --term-green: #4ade80; --term-green-dim: #22c55e; --term-green-bright: #86efac;
            --term-amber: #fbbf24; --term-cyan: #22d3ee; --term-red: #f87171;
            --term-purple: #c084fc; --term-blue: #60a5fa;
            --bg-primary: #0a0e17; --bg-secondary: #0f1623; --bg-tertiary: #151d2e;
            --bg-card: #111827; --bg-elevated: #1e293b;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #64748b;
            --border-default: #1e293b; --border-hover: #334155;
            --border-accent: rgba(74, 222, 128, 0.3);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow-glow: 0 0 20px rgba(74, 222, 128, 0.15);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); color: var(--text-primary); background: var(--bg-primary); line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.015) 2px, rgba(0,0,0,0.015) 4px);
        }

        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(10, 14, 23, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-default);
        }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
        .nav-logo {
            font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; gap: 0;
            font-family: var(--font-mono); color: var(--term-green);
        }
        .nav-logo .prompt-user { color: var(--term-green-bright); }
        .nav-logo .prompt-at { color: var(--term-amber); }
        .nav-logo .prompt-host { color: var(--term-cyan); }
        .nav-logo .prompt-colon { color: var(--text-secondary); }
        .nav-logo .prompt-path { color: var(--term-blue); }
        .nav-logo .prompt-hash { color: var(--term-red); font-weight: 800; animation: blink-hash 1.2s step-end infinite; }
        .nav-logo .cursor-block {
            display: inline-block; width: 10px; height: 18px;
            background: var(--term-green); margin-left: 2px;
            animation: cursor-blink 1s step-end infinite; vertical-align: text-bottom;
        }
        @keyframes blink-hash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .nav-links { display: flex; align-items: center; gap: 24px; }
        .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); transition: color 0.2s; font-family: var(--font-mono); }
        .nav-links a:hover { color: var(--term-green); }

        .error-main {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 140px 24px 80px; text-align: center;
        }

        .error-terminal {
            background: var(--bg-secondary); border: 1px solid var(--border-default);
            border-radius: 16px; padding: 48px; max-width: 600px; width: 100%;
            position: relative; overflow: hidden;
        }
        .error-terminal::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--term-red), var(--term-amber), var(--term-green));
        }

        .error-code {
            font-size: 6rem; font-weight: 800; font-family: var(--font-mono);
            color: var(--term-red); line-height: 1; margin-bottom: 24px;
            text-shadow: 0 0 40px rgba(248, 113, 113, 0.3);
        }

        .error-line { font-family: var(--font-mono); font-size: 1rem; margin-bottom: 8px; text-align: left; }
        .error-prompt { color: var(--term-green); }
        .error-cmd { color: var(--text-primary); }
        .error-output { color: var(--term-red); }
        .error-suggestion { color: var(--text-muted); font-style: italic; }

        .error-actions { margin-top: 32px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
            border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; border: none; cursor: pointer;
        }
        .btn-primary {
            background: rgba(74, 222, 128, 0.15); color: var(--term-green);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        .btn-primary:hover { background: rgba(74, 222, 128, 0.25); transform: translateY(-1px); box-shadow: var(--shadow-glow); }
        .btn-ghost {
            background: transparent; color: var(--text-secondary); border: 1px solid var(--border-hover);
        }
        .btn-ghost:hover { border-color: var(--term-green); color: var(--term-green); transform: translateY(-1px); }

        .footer {
            background: var(--bg-primary); color: var(--text-muted);
            padding: 32px 0; text-align: center; font-size: 0.85rem;
            border-top: 1px solid var(--border-default); font-family: var(--font-mono);
        }
        .footer a { color: var(--term-green); }
        .footer a:hover { color: var(--term-green-bright); }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .error-code { font-size: 4rem; }
            .error-terminal { padding: 32px 24px; }
            .error-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="scanline"></div>

    <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="container">
            <div class="nav-inner">
                <a href="index.html" class="nav-logo" aria-label="Home">
                    <span class="prompt-user">root</span><span class="prompt-at">@</span><span class="prompt-host">mehul</span><span class="prompt-colon">:</span><span class="prompt-path">~</span><span class="prompt-hash">#</span><span class="cursor-block"></span>
                </a>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="speaking.html">Speaking</a>
                    <a href="projects.html">Projects</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="error-main" id="main-content">
        <div class="error-terminal">
            <div class="error-code">404</div>
            <div class="error-line">
                <span class="error-prompt">root@mehul:~# </span><span class="error-cmd">cat /var/www/requested_page</span>
            </div>
            <div class="error-line">
                <span class="error-output">bash: page_not_found: No such file or directory</span>
            </div>
            <div class="error-line" style="margin-top: 16px">
                <span class="error-prompt">root@mehul:~# </span><span class="error-suggestion">Try navigating back to a known path...</span>
            </div>
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> cd ~</a>
                <a href="projects.html" class="btn btn-ghost"><i class="fas fa-code-branch"></i> ls projects/</a>
                <a href="speaking.html" class="btn btn-ghost"><i class="fas fa-microphone-alt"></i> ls speaking/</a>
            </div>
        </div>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="container">
            <p>&copy; 2026 Mehul Patel &mdash; <span style="color:var(--term-green)">chmod +x</span> life.sh &mdash; <a href="index.html">Back to Home</a></p>
        </div>
    </footer>
</body>
</html>
