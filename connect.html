<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehul Patel — Links</title>
    <meta name="description" content="All of Mehul Patel's links in one place: socials, talks, projects, blog, 1:1 sessions. DevOps & Cloud Expert, Docker Captain, GDE, AWS Community Builder.">
    <meta name="author" content="Mehul Patel">
    <link rel="canonical" href="https://nomadicmehul.dev/connect">

    <!-- Open Graph -->
    <meta property="og:title" content="Mehul Patel — Links">
    <meta property="og:description" content="Socials, talks, projects, blog and 1:1 sessions, all in one place.">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://nomadicmehul.dev/connect">
    <meta property="og:image" content="https://nomadicmehul.dev/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Mehul Patel — DevOps &amp; Cloud Expert. Docker Captain, Google Developer Expert, AWS Community Builder, Claude Ambassador. 500+ sessions in 25+ countries.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@nomadicmehul">
    <meta name="twitter:title" content="Mehul Patel — Links">
    <meta name="twitter:description" content="Socials, talks, projects, blog and 1:1 sessions, all in one place.">
    <meta name="twitter:image" content="https://nomadicmehul.dev/assets/og-image.png">
    <meta name="theme-color" content="#0a0e17">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --term-green: #4ade80; --term-green-dim: #22c55e; --term-green-bright: #86efac;
            --term-amber: #fbbf24; --term-cyan: #22d3ee; --term-red: #f87171;
            --term-purple: #c084fc; --term-blue: #60a5fa;
            --bg-primary: #0a0e17; --bg-secondary: #0f1623; --bg-tertiary: #151d2e;
            --bg-card: #111827; --bg-card-hover: #1a2332; --bg-elevated: #1e293b;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #64748b;
            --border-default: #1e293b; --border-hover: #334155;
            --border-accent: rgba(74, 222, 128, 0.3);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --shadow-glow: 0 0 20px rgba(74, 222, 128, 0.15);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font-sans); color: var(--text-primary); background: var(--bg-primary);
            line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh;
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(74, 222, 128, 0.10), transparent 70%);
        }
        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }

        #matrix-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.035; }

        .page { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; padding: 56px 16px 40px; }

        /* ===== Share ===== */
        .share-btn {
            position: absolute; top: 16px; right: 16px;
            width: 40px; height: 40px; border-radius: 50%;
            display: grid; place-items: center; cursor: pointer;
            background: var(--bg-card); color: var(--text-secondary);
            border: 1px solid var(--border-default); font-size: 0.95rem;
            transition: color .2s, border-color .2s, transform .2s;
        }
        .share-btn:hover { color: var(--term-green); border-color: var(--border-accent); transform: translateY(-1px); }

        /* ===== Profile ===== */
        .profile { text-align: center; margin-bottom: 28px; }
        .avatar-wrap { position: relative; width: 112px; height: 112px; margin: 0 auto 18px; }
        .avatar {
            width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--term-green); box-shadow: 0 0 0 6px rgba(74, 222, 128, 0.08), var(--shadow-glow);
            background: var(--bg-card);
        }
        .avatar-dot {
            position: absolute; right: 6px; bottom: 6px; width: 18px; height: 18px; border-radius: 50%;
            background: var(--term-green-dim); border: 3px solid var(--bg-primary);
        }
        .profile h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
        .handle { font-family: var(--font-mono); font-size: 0.85rem; color: var(--term-cyan); margin-top: 2px; }
        .whoami {
            display: inline-block; margin-top: 14px; max-width: 100%;
            font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.6; text-align: left;
            background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: 10px;
            padding: 10px 14px;
        }
        .whoami .p { color: var(--term-green); }
        .whoami .c { color: var(--text-primary); }
        .whoami .o { color: var(--text-secondary); display: block; }
        .bio { color: var(--text-secondary); font-size: 0.95rem; margin-top: 14px; }

        /* ===== Socials ===== */
        .socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .social {
            width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
            background: var(--bg-card); border: 1px solid var(--border-default);
            color: var(--text-secondary); font-size: 1.1rem;
            transition: color .2s, border-color .2s, background .2s, transform .2s;
        }
        .social:hover, .social:focus-visible {
            color: var(--brand, var(--term-green)); border-color: var(--brand, var(--term-green));
            background: color-mix(in srgb, var(--brand, var(--term-green)) 12%, var(--bg-card));
            transform: translateY(-2px);
        }

        /* ===== Sections ===== */
        .section { margin-top: 28px; }
        .section-title {
            font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500;
            color: var(--text-muted); margin: 0 4px 10px; letter-spacing: 0.02em;
        }
        .section-title::before { content: '$ ls ~/'; color: var(--term-green); opacity: .7; }
        .links { display: flex; flex-direction: column; gap: 10px; }

        .link {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; min-height: 64px;
            background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 14px;
            transition: border-color .2s, background .2s, transform .2s, box-shadow .2s;
        }
        .link:hover, .link:focus-visible {
            border-color: var(--border-accent); background: var(--bg-card-hover);
            transform: translateY(-2px); box-shadow: var(--shadow-glow);
        }
        .link-icon {
            flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
            background: var(--bg-elevated); color: var(--term-green); font-size: 1.05rem;
        }
        .link-thumb { flex: none; width: 56px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--bg-elevated); }
        .link-body { flex: 1; min-width: 0; }
        .link-body > span { display: block; }
        .link-kicker { font-family: var(--font-mono); font-size: 0.7rem; color: var(--term-amber); margin-bottom: 2px; }
        .link-label { font-weight: 600; font-size: 0.98rem; line-height: 1.35; }
        .link-desc { color: var(--text-muted); font-size: 0.82rem; margin-top: 2px; }
        .link-arrow { flex: none; color: var(--text-muted); font-size: 0.8rem; transition: color .2s, transform .2s; }
        .link:hover .link-arrow { color: var(--term-green); transform: translateX(2px); }

        .link.highlight {
            border-color: rgba(74, 222, 128, 0.45);
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.12), rgba(34, 211, 238, 0.06) 60%, var(--bg-card));
        }
        .link.highlight .link-icon { background: var(--term-green); color: var(--bg-primary); }

        .auto .link-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* ===== States ===== */
        .loading { text-align: center; font-family: var(--font-mono); color: var(--text-muted); font-size: 0.85rem; padding: 32px 0; }
        .loading::after { content: '_'; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .toast {
            position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
            background: var(--bg-elevated); border: 1px solid var(--border-accent); color: var(--term-green);
            font-family: var(--font-mono); font-size: 0.85rem; padding: 10px 16px; border-radius: 10px;
            transition: opacity .25s, transform .25s; pointer-events: none; z-index: 10;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        .footer { margin-top: 40px; text-align: center; font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); }
        .footer a { color: var(--term-green); }
        .footer a:hover { color: var(--term-green-bright); }

        .fade { opacity: 0; transform: translateY(8px); animation: fade-up .45s ease forwards; }
        @keyframes fade-up { to { opacity: 1; transform: none; } }

        a:focus-visible, button:focus-visible { outline: 2px solid var(--term-green); outline-offset: 2px; }

        .preview .fade { animation: none; opacity: 1; transform: none; }
        .preview .link:hover { transform: none; }
        @media (prefers-reduced-motion: reduce) {
            .fade { animation: none; opacity: 1; transform: none; }
            .link, .social, .share-btn { transition: none; }
            .link:hover, .social:hover { transform: none; }
        }
        @media (max-width: 380px) {
            .page { padding-top: 48px; }
            .link { padding: 12px 14px; gap: 12px; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-bg" aria-hidden="true"></canvas>

    <main class="page">
        <button class="share-btn" id="share" type="button" aria-label="Share this page" title="Share">
            <i class="fas fa-share-nodes"></i>
        </button>
        <div id="app"><p class="loading">loading links</p></div>
        <footer class="footer">
            <a href="index.html">nomadicmehul.dev</a> &middot; &copy; <span id="year">2026</span> Mehul Patel
        </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // Content comes from data/links.json (see CLAUDE.md → Connect page). Escape everything from data.
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        // Links here may also be mailto: or a page of this site (speaking.html, index.html#about)
        const safeUrl = u => /^(https?:\/\/|mailto:|assets\/|[\w-]+\.html(#[\w-]*)?$)/i.test(String(u ?? '')) ? esc(u) : '#';
        const isExternal = u => /^https?:\/\//i.test(u);
        const PAGE_URL = 'https://nomadicmehul.dev/connect';

        // Icon + brand color guessed from the URL, so a link only needs a label and url
        const BRANDS = [
            [/github\.com/, 'fab fa-github', '#e2e8f0'],
            [/linkedin\.com/, 'fab fa-linkedin-in', '#0a66c2'],
            [/(twitter|x)\.com/, 'fab fa-x-twitter', '#e2e8f0'],
            [/youtube\.com|youtu\.be/, 'fab fa-youtube', '#ff0000'],
            [/instagram\.com/, 'fab fa-instagram', '#e4405f'],
            [/medium\.com/, 'fab fa-medium', '#e2e8f0'],
            [/bsky\.app/, 'fab fa-bluesky', '#1185fe'],
            [/threads\.net/, 'fab fa-threads', '#e2e8f0'],
            [/mastodon|fosstodon|hachyderm/, 'fab fa-mastodon', '#6364ff'],
            [/facebook\.com/, 'fab fa-facebook-f', '#1877f2'],
            [/tiktok\.com/, 'fab fa-tiktok', '#ff0050'],
            [/discord\.(gg|com)/, 'fab fa-discord', '#5865f2'],
            [/t\.me|telegram/, 'fab fa-telegram', '#26a5e4'],
            [/wa\.me|whatsapp/, 'fab fa-whatsapp', '#25d366'],
            [/dev\.to/, 'fab fa-dev', '#e2e8f0'],
            [/stackoverflow\.com/, 'fab fa-stack-overflow', '#f48024'],
            [/hub\.docker\.com|docker\.com/, 'fab fa-docker', '#2496ed'],
            [/slideshare|speakerdeck/, 'fas fa-person-chalkboard', '#22d3ee'],
            [/sessionize\.com/, 'fas fa-microphone', '#22d3ee'],
            [/topmate\.io|calendly\.com|cal\.com/, 'fas fa-calendar-check', '#4ade80'],
            [/buymeacoffee\.com|ko-fi\.com/, 'fas fa-mug-hot', '#fbbf24'],
            [/credly\.com/, 'fas fa-award', '#ff6b00'],
            [/spotify\.com/, 'fab fa-spotify', '#1db954'],
            [/podcasts\.apple\.com/, 'fas fa-podcast', '#a855f7'],
            [/g\.dev|developers\.google\.com/, 'fab fa-google', '#4285f4'],
            [/^mailto:/, 'fas fa-envelope', '#4ade80'],
        ];
        const brandOf = url => BRANDS.find(([re]) => re.test(String(url).toLowerCase())) || [null, 'fas fa-link', null];

        const anchorAttrs = url => isExternal(url) ? ' target="_blank" rel="noopener"' : '';

        const fetched = {};   // one request per file, even when the preview re-renders on every keystroke
        const fetchJson = path => fetched[path] ||= fetch(path, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(path); return r.json(); });
        // ?preview: Links Studio shows this page in a frame and sends the draft links.json with postMessage
        const PREVIEW = new URLSearchParams(location.search).has('preview');

        const todayLocal = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const fmtDate = iso => {
            const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
            return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        };

        function linkCard({ url, label, description, icon, highlight, kicker, thumb, extraClass = '' }) {
            const media = thumb
                ? `<img class="link-thumb" src="${safeUrl(thumb)}" alt="" loading="lazy">`
                : `<span class="link-icon"><i class="${esc(icon || brandOf(url)[1])}"></i></span>`;
            return `<a class="link fade ${highlight ? 'highlight' : ''} ${extraClass}" href="${safeUrl(url)}"${anchorAttrs(url)}>
                ${media}
                <span class="link-body">
                    ${kicker ? `<span class="link-kicker">${esc(kicker)}</span>` : ''}
                    <span class="link-label">${esc(label)}</span>
                    ${description ? `<span class="link-desc">${esc(description)}</span>` : ''}
                </span>
                <i class="fas ${isExternal(url) ? 'fa-arrow-up-right-from-square' : 'fa-chevron-right'} link-arrow" aria-hidden="true"></i>
            </a>`;
        }

        // ===== Auto cards: filled from the site's other data files =====
        const AUTO = {
            'next-talk': async () => {
                const events = await fetchJson('data/speaking.json');
                const today = todayLocal();
                const upcoming = events.filter(e => e.date && e.date >= today).sort((a, b) => a.date.localeCompare(b.date));
                const e = upcoming[0] || [...events].sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
                if (!e) return '';
                const isNext = !!upcoming[0];
                let kicker = isNext ? 'Next talk' : 'Latest talk';
                if (isNext) {
                    const days = Math.round((new Date(e.date + 'T00:00:00') - new Date(today + 'T00:00:00')) / 864e5);
                    kicker += days === 0 ? ' · today' : days === 1 ? ' · tomorrow' : ` · in ${days} days`;
                }
                return linkCard({
                    url: isNext ? 'speaking.html#upcoming' : 'speaking.html',
                    label: e.title, kicker, icon: 'fas fa-microphone',
                    description: [fmtDate(e.date), e.location].filter(Boolean).join(' · '),
                    extraClass: 'auto',
                });
            },
            'latest-post': async () => {
                const posts = await fetchJson('data/blog.json');
                const p = [...posts].sort((a, b) => String(b.pubDate).localeCompare(String(a.pubDate)))[0];
                if (!p) return '';
                return linkCard({
                    url: p.link, label: p.title, thumb: p.thumbnail, icon: 'fab fa-medium',
                    kicker: ['Latest article', p.readTime].filter(Boolean).join(' · '),
                    description: fmtDate(p.pubDate), extraClass: 'auto',
                });
            },
        };

        async function renderLink(l) {
            if (l.hidden) return '';
            if (l.auto) {
                try { return AUTO[l.auto] ? await AUTO[l.auto]() : ''; } catch { return ''; }
            }
            if (!l.label || !l.url) return '';
            return linkCard(l);
        }

        async function load() {
            try { render(await fetchJson('data/links.json')); }
            catch {
                document.getElementById('app').innerHTML = `<p class="loading" style="animation:none">Couldn't load links. Visit <a href="index.html" style="color:var(--term-green)">nomadicmehul.dev</a></p>`;
            }
        }

        let renderSeq = 0;
        async function render(data) {
            const app = document.getElementById('app');
            const seq = ++renderSeq;
            const p = data.profile || {};
            const socials = (data.socials || []).filter(s => !s.hidden && s.url).map(s => {
                const [, icon, color] = brandOf(s.url);
                return `<a class="social" href="${safeUrl(s.url)}"${anchorAttrs(s.url)} aria-label="${esc(s.label)}" title="${esc(s.label)}"${color ? ` style="--brand:${esc(color)}"` : ''}>
                    <i class="${esc(s.icon || icon)}"></i></a>`;
            }).join('');

            const sections = await Promise.all((data.sections || []).map(async s => {
                const cards = (await Promise.all((s.links || []).map(renderLink))).filter(Boolean);
                if (!cards.length) return '';
                return `<section class="section" aria-label="${esc(s.title)}">
                    ${s.title ? `<h2 class="section-title">${esc(String(s.title).toLowerCase().replace(/\s+/g, '-'))}</h2>` : ''}
                    <div class="links">${cards.join('')}</div>
                </section>`;
            }));
            if (seq !== renderSeq) return;   // a newer render (preview update) finished first

            app.innerHTML = `
                <header class="profile fade">
                    <div class="avatar-wrap">
                        <img class="avatar" src="${safeUrl(p.avatar || 'assets/img/profile.jpg')}" alt="${esc(p.name)}" width="112" height="112">
                        <span class="avatar-dot" title="Available for speaking"></span>
                    </div>
                    <h1>${esc(p.name)}</h1>
                    ${p.handle ? `<div class="handle">@${esc(p.handle)}</div>` : ''}
                    ${p.tagline ? `<div class="whoami"><span class="p">$ </span><span class="c">whoami</span><span class="o">${esc(p.tagline)}</span></div>` : ''}
                    ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : ''}
                    ${socials ? `<nav class="socials" aria-label="Social profiles">${socials}</nav>` : ''}
                </header>
                ${sections.join('')}`;

            // Stagger the entrance
            app.querySelectorAll('.fade').forEach((el, i) => el.style.animationDelay = `${Math.min(i * 40, 600)}ms`);
        }

        // ===== Share: native sheet on phones, copy link elsewhere =====
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
        }
        document.getElementById('share').addEventListener('click', async () => {
            if (navigator.share) {
                try { await navigator.share({ title: document.title, url: PAGE_URL }); } catch { /* dismissed */ }
                return;
            }
            try { await navigator.clipboard.writeText(PAGE_URL); toast('Link copied: nomadicmehul.dev/connect'); }
            catch { toast(PAGE_URL); }
        });

        document.getElementById('year').textContent = new Date().getFullYear();
        if (PREVIEW && window.parent !== window) {
            document.body.classList.add('preview');
            addEventListener('message', e => {
                if (e.origin !== location.origin || e.source !== window.parent || e.data?.type !== 'links-preview') return;
                render(e.data.links);
            });
            // links in the preview don't navigate the frame away
            document.addEventListener('click', e => { if (e.target.closest('a')) e.preventDefault(); });
            window.parent.postMessage({ type: 'links-preview-ready' }, location.origin);
        }
        if (!PREVIEW || window.parent === window) {
            load();
        }

        // ===== Matrix rain (subtle, skipped for reduced motion) =====
        (function () {
            if (PREVIEW || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const canvas = document.getElementById('matrix-bg');
            const ctx = canvas.getContext('2d');
            const chars = '01{}[]()<>/\\|;:=+-*&^%$#@!~abcdef0123456789';
            let w, h, drops;
            function resize() {
                w = canvas.width = innerWidth; h = canvas.height = innerHeight;
                drops = Array(Math.floor(w / 14)).fill(1);
            }
            function draw() {
                ctx.fillStyle = 'rgba(10, 14, 23, 0.06)'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#4ade80'; ctx.font = '14px JetBrains Mono, monospace';
                drops.forEach((y, i) => {
                    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 14, y * 14);
                    drops[i] = y * 14 > h && Math.random() > 0.975 ? 0 : y + 1;
                });
            }
            resize(); addEventListener('resize', resize);
            setInterval(() => { if (!document.hidden) draw(); }, 50);
        })();
    </script>
</body>
</html>
