<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#0a0e17"/>
  
  <!-- Terminal prompt: > _ -->
  <g fill="#22c55e" font-family="monospace" font-size="20" font-weight="bold">
    <!-- Greater than symbol -->
    <text x="4" y="22" font-size="18">></text>
    
    <!-- Underscore/cursor -->
    <text x="16" y="22" font-size="14">_</text>
  </g>
  
  <!-- Optional subtle border -->
  <rect width="32" height="32" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
</svg>
